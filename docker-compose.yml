# Local-only Midnight ledger-v8 stack. Versions mirror create-mn-app 0.31.1.
name: midnight-swarm-devnet

services:
  midnight-bridge:
    build:
      context: .
      dockerfile: bridge/Dockerfile
    restart: unless-stopped
    environment:
      BRIDGE_PORT: '3001'
      DRONE_SECRET_HEX: '${MIDNIGHT_DRONE_SECRET_HEX:-}'
      MISSION_MANIFEST_PATH: '/public/mission-manifest.json'
    volumes:
      - ./web/public:/public
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 10s
    depends_on:
      indexer:
        condition: service_healthy
      node:
        condition: service_healthy
      proof-server:
        condition: service_healthy

  ros-simulator:
    build:
      context: .
      dockerfile: ros2_ws/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      ROS_DOMAIN_ID: '42'
      DISPLAY: '${DISPLAY:-}'
      XAUTHORITY: '/tmp/.docker.xauth'
      MIDNIGHT_SWARM_LIVE_PLOT: '${MIDNIGHT_SWARM_LIVE_PLOT:-0}'
    volumes:
      - ./demo-output:/demo-output
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - '${XAUTHORITY:-/dev/null}:/tmp/.docker.xauth:ro'
    depends_on:
      midnight-bridge:
        condition: service_healthy
    stop_grace_period: 10s

  node:
    image: midnightntwrk/midnight-node:1.0.0
    ports:
      - '127.0.0.1:9944:9944'
    environment:
      CFG_PRESET: 'dev'
      SIDECHAIN_BLOCK_BENEFICIARY: '04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf -H ''Content-Type: application/json'' -d ''{"id":1,"jsonrpc":"2.0","method":"chain_getBlockHash","params":[1]}'' http://localhost:9944 | grep -q ''"result":"0x''',
        ]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 20s

  indexer:
    image: midnightntwrk/indexer-standalone:4.3.3
    restart: on-failure
    ports:
      - '127.0.0.1:8088:8088'
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
      APP__APPLICATION__NETWORK_ID: 'undeployed'
      APP__INFRA__NODE__URL: 'ws://node:9944'
      APP__INFRA__STORAGE__PASSWORD: 'indexer'
      APP__INFRA__PUB_SUB__PASSWORD: 'indexer'
      APP__INFRA__LEDGER_STATE_STORAGE__PASSWORD: 'indexer'
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
      APP__INFRA__SPO_NODE__URL: 'ws://node:9944'
      APP__INFRA__SPO_NODE__BLOCKFROST_ID: 'local-devnet-dummy-id'
    healthcheck:
      test: ['CMD-SHELL', 'cat /var/run/indexer-standalone/running']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      node:
        condition: service_healthy

  proof-server:
    image: midnightntwrk/proof-server:8.1.0
    command: ['midnight-proof-server', '-v']
    ports:
      - '127.0.0.1:6300:6300'
    environment:
      RUST_BACKTRACE: 'full'
    healthcheck:
      test: ['CMD-SHELL', 'echo > /dev/tcp/127.0.0.1/6300']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
